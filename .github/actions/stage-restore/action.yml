name: Restore build tree
description: Unpack the build tree saved by a previous job.
inputs:
  from:
    description: Artifact name of the build tree to restore
    required: true
runs:
  using: composite
  steps:
    - name: Download build tree
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.from }}
        path: ${{ runner.temp }}/tree
    - name: Unpack build tree
      shell: sh -e {0}
      run: |
        tar -xzpf "$RUNNER_TEMP/tree/tree.tar.gz"
        rm -rf "$RUNNER_TEMP/tree"
        # Tarballs are left out of the artifact; put them back where seed.sh
        # copied them (jobs that only fetch the 07 sources don't need them).
        if [ -d 06/stage/downloads ] && [ -d 06/downloads ]; then
          cp 06/downloads/* 06/stage/downloads
        fi
