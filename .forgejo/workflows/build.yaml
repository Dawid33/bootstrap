name: Build Project

on: [push]
jobs:
  build:
    runs-on: docker
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
      - name: Setup chroot
        run: |
          su root
          mkdir -p 06/stage/dev/shm
          mkdir -p etc
          echo "nameserver 8.8.8.8"  > etc/resolv.conf
          mknod 06/stage/dev/null c 1 3
          chmod 666 06/stage/dev/null
          chroot $(pwd) /busybox ash
      - name: Build tcc
        run: su root && chroot $(pwd) /busybox ash initboot.sh
      - name: Download tarballs and build proto-{tcc,musl,busybox}

        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci_stage1.sh'
      - name: Build 2a0-static-gnumake
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2a0-static-gnumake.sh'
      - name: Build 2a1-static-binutils
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2a1-static-binutils.sh'
      - name: Build 2a2-static-gnugcc4-c
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2a2-static-gnugcc4-c.sh'
      - name: Build 2a3-intermediate-musl
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2a3-intermediate-musl.sh'
      - name: Build 2a4-gnugcc4-cpp
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2a4-gnugcc4-cpp.sh'
      - name: Build 2a5-gnugcc10
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2a5-gnugcc10.sh'
      - name: Build 2a6-linux-headers
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2a6-linux-headers.sh'
      - name: Build 2a7-cmake
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2a7-cmake.sh'
      - name: Build 2a8-python
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2a8-python.sh'
      - name: Build 2a9-intermediate-clang
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2a9-intermediate-clang.sh'
      - name: Build 2b0-musl
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2b0-musl.sh'
      - name: Build 2b1-clang
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2b1-clang.sh'
      - name: Build 2b2-busybox
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2b2-busybox.sh'
      - name: Build 2b3-gnumake
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2b3-gnumake.sh'
      - name: Build 2b4-gnugcc13
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2b4-gnugcc13.sh'
      - name: Build 2b5-m4
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2b5-m4.sh'
      - name: Build 2b6-grep
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2b6-grep.sh'
      - name: Build 2b7-gawk
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2b7-gawk.sh'
      - name: Build 2b8-bison
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2b8-bison.sh'
      - name: Build 2c3-perl
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2c3-perl.sh'
      - name: Build 2c4-autoconf
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2c4-autoconf.sh'
      - name: Build 2c4-automake
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2c4-automake.sh'
      - name: Build 2c0-libtool
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2c0-libtool.sh'
      - name: Build 2c1-coreutils
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2b11-file.sh'
      - name: Build 2c4-binutils
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2c4-binutils.sh'
      - name: Build 2c1-gcc-intermediate
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2c1-gcc-intermediate.sh'
      - name: Build 2c0-glibc
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2c0-glibc.sh'
      - name: Build 2c1-libstdc++
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2c1-libstdc++.sh'
      - name: Build 2c1-crosstools
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2c1-crosstools.sh'
      - name: Build 2c1-binutils
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2c1-binutils.sh'
      - name: Build 2c1-gcc
        run: su root && chroot $(pwd) /busybox ash -c 'cd 06 && /busybox ash ./ci.sh /recipes/2c1-gcc.sh'

      - name: Build build-fs
        run: su root && chroot $(pwd) /busybox ash -c 'cd 07 && /busybox ash ./build_fs.sh'
      - name: Setup chroot in fs
        run: |
          su root
          mkdir -p 07/fs/dev/shm
          mkdir -p 07/fs/proc
          mkdir -p etc
          echo "nameserver 8.8.8.8"  > etc/resolv.conf
          mknod 07/fs/dev/null c 1 3
          chmod 666 07/fs/dev/null
          mount -tproc none 07/fs/proc;
          chroot $(pwd) /busybox ash
      - name: Build host-python
        run: su root && chroot $(pwd) /busybox ash -c 'cd 07 && /busybox ash ./ci.sh host-python'
